# DO NOT MERGE. Repeats the macOS leg of the vmnet job in test.yml for each way
# of starting the instances, to find out which one loses the runner.
name: vmnet-runner-loss

on:
  pull_request:

env:
  LIMACTL_CREATE_ARGS: ""
  GOTOOLCHAIN: local

permissions:
  contents: read

concurrency:
  group: vmnet-runner-loss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vmnet:
    name: "VMNet ${{ matrix.run }} ${{ matrix.arm }}"
    runs-on: macos-15-large  # Intel; socket_vmnet
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        run: [1, 2, 3, 4, 5, 6, 7, 8]
        # two-shared lost the runner in 5 of 8 jobs at the default size (4 CPUs, 4 GiB),
        # and in about 4 of 8 at 1 CPU / 1 GiB. two-user drops socket_vmnet.
        arm: [two-user]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Without tags, limactl warns about its version on stderr.
        fetch-depth: 0
        submodules: true
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: stable
        cache: false
    - name: Make
      run: make
    - name: "Inject `no_timer_check` to kernel cmdline"
      if: runner.os == 'macOS'
      # workaround to https://github.com/lima-vm/lima/issues/84
      run: |
        export PATH="$PWD/_output/bin:$PATH"
        ./hack/inject-cmdline-to-template.sh _output/share/lima/templates/_images/ubuntu.yaml no_timer_check
    - name: Install
      run: sudo make install
    - name: "Adjust LIMACTL_CREATE_ARGS"
      run: echo "LIMACTL_CREATE_ARGS=${LIMACTL_CREATE_ARGS} --vm-type=qemu --network=lima:shared" >>$GITHUB_ENV
    - name: Cache image used by default .yaml
      uses: $/.github/actions/setup_cache_for_template
      with:
        template: templates/default.yaml
    - name: Install test dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install qemu bash coreutils w3m
    - name: Install socket_vmnet
      if: runner.os == 'macOS'
      env:
        SOCKET_VMNET_VERSION: v1.2.2
      run: |
        cd ~
        git clone https://github.com/lima-vm/socket_vmnet
        cd socket_vmnet
        git checkout $SOCKET_VMNET_VERSION
        sudo git config --global --add safe.directory /Users/runner/socket_vmnet
        sudo make PREFIX=/opt/socket_vmnet install
    - name: Install test dependencies (Linux)
      if: runner.os == 'Linux'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo ./hack/install-qemu.sh
        sudo apt-get install -y --no-install-recommends dnsmasq-base iperf3 w3m
    - name: Install sudoers file
      # The BATS tests use their own LIMA_HOME, so generate the file from its networks.yaml.
      run: LIMA_HOME="$HOME/.lima-bats" limactl sudoers | sudo tee /etc/sudoers.d/lima
    - name: Unit test (pkg/networks)
      # Set -count=1 to disable cache
      run: go test -v -count=1 ./pkg/networks/...
    - name: Test shared network with templates/default.yaml
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
      with:
        timeout_minutes: 30
        retry_on: error
        max_attempts: 3
        command: ./hack/test-templates.sh templates/default.yaml
    - if: always()
      uses: $/.github/actions/upload_failure_logs_if_exists
      with:
        suffix: ${{ matrix.arm }}-${{ matrix.run }}
    # "bridged" is not tested: it needs a pre-existing bridge on the host.
    - name: "Run BATS shared/host network tests"
      env:
        NETWORK_ARM: ${{ matrix.arm }}
        NETWORK_START_ARGS: ${{ matrix.arm == 'two-shared-small' && '--cpus 1 --memory 1' || '' }}
      run: ./hack/bats/lib/bats-core/bin/bats --timing ./hack/bats/extras/network-shared-host.bats
