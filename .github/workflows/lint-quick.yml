name: lint-quick

# These checks cover the whole tree, docs included, so this workflow runs
# without the paths-ignore filter that test.yml uses to skip docs-only changes.
on:
  push:
    branches:
    - master
    - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  lint-quick:
    name: "Quick lints"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: stable
        cache: false
    - name: Run editorconfig-checker
      run: make editorconfig-checker
    - name: Run yamllint
      run: make yamllint
    - name: Run file and directory name linter
      uses: ls-lint/action@02e380fe8733d499cbfc9e22276de5085508a5bd  # v2.3.1
    - name: Check hyperlinks
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        LYCHEE_VERSION: v0.24.2
        LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
      run: |
        tarball=lychee-x86_64-unknown-linux-gnu.tar.gz
        curl --fail --silent --show-error --location --remote-name \
          "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/${tarball}"
        echo "${LYCHEE_SHA256}  ${tarball}" | sha256sum --check -
        tar --extract --gzip --file "${tarball}" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
        args=(
          --exclude https://img.shields.io
          --exclude http://127.0.0.1:8080
          --exclude https://github.com/lima-vm/lima/releases/download
          --exclude https://xbarapp.com
          --exclude https://api.github.com
          --exclude https://cloud-native.slack.com
          --exclude https://x.com
          --exclude https://deepwiki.com
          README.md
        )
        # lychee does not retry a failed connection, so one briefly unreachable
        # host fails the whole check. Run it again after a pause.
        for attempt in 1 2 3; do
          if ./lychee "${args[@]}"; then
            exit 0
          fi
          if [ "${attempt}" -lt 3 ]; then
            echo "::warning::Check hyperlinks attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          fi
        done
        exit 1
